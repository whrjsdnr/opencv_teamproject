# Repository-local defaults; do not inherit unrelated user-wide rule sets.
target-version = "py310"
line-length = 100
exclude = [".venv", ".git", ".agents", ".codex", "outputs", "results"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Direct-file entrypoints insert the repository root before local imports.
"src/main.py" = ["E402"]
"scripts/run_experiments.py" = ["E402"]
